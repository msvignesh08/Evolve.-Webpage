    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Evolve",
            "applicationCategory": "ProductivityApplication",
            "operatingSystem": "Android",
            "description": "Make time for what matters. Focus sessions, app blocking, study timetable, 12-week progress dashboard, and focus rooms. We never sell your data.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do you collect or sell my data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. We never sell your data — not now, not ever. Evolve has no ads, no analytics, and no accounts. Your focus history, settings, app groups, and timetable stay on your phone."
                }
              },
              {
                "@type": "Question",
                "name": "Is Evolve available for Android?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. This website is prepared for the Android APK build supplied with it."
                }
              },
              {
                "@type": "Question",
                "name": "Why does Evolve ask for multiple Android permissions?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Android sandboxes apps strictly, so reliable app blocking requires separate permissions: Usage Access to detect blocked apps locally, Display Over Other Apps to show the block shield, Exact Alarms for scheduled study blocks, and Notifications/Battery exemption so timers are not killed in the background. Evolve never requests Location, Contacts, Camera, or Microphone access."
                }
              },
              {
                "@type": "Question",
                "name": "Can I customize the look and feel of Evolve?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Evolve includes 8 built-in themes along with toggles for glass effects, vibrant colour, and motivational quotes."
                }
              }
            ]
          }
        ]
      }
    </script>
